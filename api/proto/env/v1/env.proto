syntax = "proto3";

package qrixr.env.v1;

option go_package = "github.com/Skoowshot/qrix-runtime/gen/go/env/v1;envv1";

service EnvironmentService {
  rpc Connect(ConnectRequest) returns (ConnectResponse);
  rpc OpenCall(stream OpenCallRequest) returns (stream OpenCallResponse);
  rpc OpenStream(stream OpenStreamRequest) returns (stream OpenStreamResponse);
}

message ConnectRequest {
  uint64 workspace_id = 1;
  string name = 2;

  bytes metadata = 3;
}

message ConnectResponse {
  string session_token = 1;
}

message OpenCallRequest {
  CallFrame frame = 1;
}

message OpenCallResponse {
  CallFrame frame = 1;
}

message CallFrame {
  uint64 id = 1;
  oneof kind {
    CallRequest request = 2;
    CallResponse response = 3;
  }
}

message CallRequest {}

message CallResponse {}

message OpenStreamRequest {
  StreamFrame frame = 1;
}

message OpenStreamResponse {
  StreamFrame frame = 1;
}

message StreamFrame {
  uint64 id = 1;
  oneof kind {
    StreamOpen open = 2;
    StreamChunk chunk = 3;
    StreamEnd end = 4;
  }
}

message StreamOpen {}

message StreamChunk {
  bytes data = 1;
}

message StreamEnd {}